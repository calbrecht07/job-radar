# Copy to .github/workflows/scan.yml in YOUR data repo (private).
# Daily opportunity search: every company in the pool, 6x a day. Writes scan/ and report/.
name: scan

on:
  schedule:
    - cron: "7 5,8,11,14,16,19 * * *"   # UTC
  workflow_dispatch:
    inputs:
      audit:
        description: "Also audit job boards on every wishlist careers page"
        type: boolean
        default: false

concurrency:
  group: radar-scan
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: calbrecht07/job-radar
          path: .engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r .engine/requirements.txt && mkdir -p scan state report
      - name: Scan every company and build the report
        run: |
          AUDIT=""
          if [ "${{ github.event.inputs.audit }}" = "true" ] || [ "$(date -u +%u%H)" = "105" ]; then AUDIT="--audit"; fi
          PYTHONPATH=.engine python -m radar.scan --data . $AUDIT
      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add state scan report extra_roles.json
          git diff --cached --quiet && exit 0
          git commit -q -m "scan: $(tail -n1 scan/runs.log)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
